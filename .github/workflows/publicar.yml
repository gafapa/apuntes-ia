# Compila los instaladores de Windows, macOS y Linux y los publica en GitHub Releases
# al subir una etiqueta de versión:  git tag v0.2.0 && git push origin v0.2.0
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            plataforma: win
            certificado: WIN_CERTIFICADO
            clave: WIN_CERTIFICADO_CLAVE
          - so: macos-latest
            plataforma: mac
            certificado: MAC_CERTIFICADO
            clave: MAC_CERTIFICADO_CLAVE
          - so: ubuntu-latest
            plataforma: linux
            certificado: NINGUNO
            clave: NINGUNO
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/fetch-bin.mjs ${{ matrix.plataforma }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Instalador y publicación
        shell: bash
        # Los secretos que no existen llegan vacíos y electron-builder tomaría un CSC_LINK vacío por
        # una ruta: se quitan antes de compilar
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder --${{ matrix.plataforma }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma (opcional, ver README): si existen estos secretos, el instalador sale firmado y,
          # en macOS, notarizado. Sin ellos se publica sin firmar, como hasta ahora.
          CSC_LINK: ${{ secrets[matrix.certificado] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.clave] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
